name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os; from product import VERSION; assert os.environ['RELEASE_TAG'] == 'v'+VERSION, 'Tag must match product.VERSION'"
      - name: Install hash-checked build dependencies
        run: |
          python -m pip --isolated install --disable-pip-version-check --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r requirements-build-windows.lock
      - name: Test profile compatibility and safe imports
        run: python -m unittest discover -s tests -v
      - name: Build EXE, smoke test and installer
        run: python build_windows.py
      - name: Smoke test installer and uninstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem release/AetherRoute-Setup-*.exe | Select-Object -First 1).FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'AetherRoute-install-test'
          $setup = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $application = Join-Path $installDir 'AetherRoute.exe'
          if (!(Test-Path $application)) { throw 'Installer did not create AetherRoute.exe' }
          $check = Start-Process -FilePath $application -ArgumentList '--self-test' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "Installed application failed self-test: $($check.ExitCode)" }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstall.ExitCode)" }
          if (Test-Path $application) { throw 'Uninstall left the application executable behind' }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-release
          path: release/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download this run's build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name windows-release --dir release
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          Download the Setup EXE for per-user installation, or extract the whole portable Windows ZIP.
          This is an unsigned release candidate. Test game binding, map/minimap tracking, DPI and save/restart before publishing.
          Saved profiles remain under LOCALAPPDATA/Aion2RouteSync. Application license: MIT. No advertisements.
          NOTES
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --prerelease --title "$RELEASE_TAG" --notes-file notes.md
